<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prerender Never Ready</title>
</head>
<body>
    <h1>Never Signals Readiness</h1>
    <p id="immediate">PRERENDER_IMMEDIATE_CONTENT</p>
    <!-- Neither readiness property nor a parked redirect is ever set: this is what a page
         becomes once its bundle stops carrying the prerender contract. -->
</body>
</html>
