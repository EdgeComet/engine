<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
    <script>
        // What a prerender-aware application does with a URL it will not render: it parks the

        window.prerenderRedirectUrl = '/prerender/destination.html';
    </script>
</head>

</body>
