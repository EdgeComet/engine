<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smooth Scroller Lazy Content</title>
    <style>
        /* The body-scroller shape, with the page asking for animated scrolling. Every scroll
           the renderer performs is animated unless it opts out per call. */
        html { overflow: hidden; height: 100%; margin: 0; scroll-behavior: smooth; }
        body { overflow-y: auto; height: 100%; margin: 0; font-family: sans-serif; scroll-behavior: smooth; }
        .spacer { height: 4000px; background: #f0f0f0; }
        .sentinel { height: 8px; }
    </style>
</head>
<body>
    <h1>Smooth Scroller</h1>
    <p id="above-fold">ABOVE_FOLD_CONTENT</p>

    <div class="spacer">Filler that pushes the sentinel far below the viewport</div>
    <div class="sentinel" id="sentinel"></div>
    <div id="lazy-target"></div>

    <script>
        var mounted = false;
        var observer = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
                if (!entry.isIntersecting || mounted) {
                    return;
                }
                mounted = true;
                observer.disconnect();

                // An AJAX request, not a timer: a timer leaves the network idle and Chrome
                // captures the page before the section reaches the DOM.
                fetch('/api/mock-data?delay=300')
                    .then(function (response) { return response.json(); })
                    .then(function () {
                        var section = document.createElement('div');
                        section.id = 'lazy-section';
                        section.textContent = 'LAZY_SECTION_LOADED';
                        document.getElementById('lazy-target').appendChild(section);
                    });
            });
        });

        observer.observe(document.getElementById('sentinel'));
    </script>
</body>
</html>
