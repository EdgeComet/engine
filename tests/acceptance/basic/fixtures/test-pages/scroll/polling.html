<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Polling Page With Lazy Content</title>
    <style>
        body { margin: 0; font-family: sans-serif; }
        .spacer { height: 4000px; background: #f0f0f0; }
        .sentinel { height: 8px; }
    </style>
</head>
<body>
    <h1>Continuous Polling</h1>
    <p id="above-fold">ABOVE_FOLD_CONTENT</p>

    <div class="spacer">Filler that pushes the sentinel far below the viewport</div>
    <div class="sentinel" id="sentinel"></div>
    <div id="lazy-target"></div>

    <script>
        // Requests that never stop, the way a live odds or price feed behaves. networkIdle
        // therefore never fires and the render reaches its soft timeout, which is the case
        // where a scroll pass gated behind the timeout flag would silently never run.
        setInterval(function () {
            fetch('/api/mock-data?delay=800');
        }, 200);

        var mounted = false;
        var observer = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
                if (!entry.isIntersecting || mounted) {
                    return;
                }
                mounted = true;
                observer.disconnect();

                fetch('/api/mock-data?delay=300')
                    .then(function (response) { return response.json(); })
                    .then(function () {
                        var section = document.createElement('div');
                        section.id = 'lazy-section';
                        section.textContent = 'LAZY_SECTION_LOADED';
                        document.getElementById('lazy-target').appendChild(section);
                    });
            });
        });

        observer.observe(document.getElementById('sentinel'));
    </script>
</body>
</html>
